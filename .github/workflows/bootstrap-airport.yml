name: Bootstrap JoTrip Airport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-airport.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout standalone Airport source
        uses: actions/checkout@v4
        with:
          repository: kenzuko/Jotrip-Lab
          ref: deploy/airport-standalone
          path: source

      - name: Copy Airport into repository root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            source/ target/
          if [ ! -s target/jotrip-logo-master.png ] && [ -s target/jotrip-logo.png ]; then
            cp target/jotrip-logo.png target/jotrip-logo-master.png
          fi
          printf 'airport.openphuquoc.com\n' > target/CNAME

      - name: Commit standalone site
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: bootstrap standalone Airport Live site'
          git push origin main
